name: CD

# Deploy only after CI has gone green on main. Using workflow_run rather than
# a plain push trigger means a merge that breaks the build never reaches AWS.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  # Required for OIDC federation with AWS. No long-lived access keys are
  # stored anywhere in this repository (NFR-4).
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and deploy to ECS
    runs-on: ubuntu-latest
    environment: production

    # Skip cleanly on a fork or before AWS is configured, rather than failing
    # every push with a credentials error.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success') &&
      vars.AWS_REGION != '' && vars.ECR_REPOSITORY != ''

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagged by commit SHA so a deployment is traceable to its source,
          # with a moving tag for convenience.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Render API task definition
        id: api-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs-task-definition.json
          container-name: leaf-api
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-task.outputs.task-definition }}
          service: ${{ vars.ECS_API_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          # Block until ECS reports steady state, so a failed rollout fails
          # the workflow instead of passing silently.
          wait-for-service-stability: true

      - name: Render UI task definition
        id: ui-task
        if: vars.ECS_UI_SERVICE != ''
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs-task-definition-ui.json
          container-name: leaf-ui
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy UI service
        if: vars.ECS_UI_SERVICE != ''
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.ui-task.outputs.task-definition }}
          service: ${{ vars.ECS_UI_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: \`${{ vars.ECR_REPOSITORY }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- cluster: \`${{ vars.ECS_CLUSTER }}\`" >> "$GITHUB_STEP_SUMMARY"
