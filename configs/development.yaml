# Fast feedback loop: small backbone, few epochs, CPU-friendly defaults.
# Override any key from the environment, e.g. MLC_TRAINING__EPOCHS=1.

seed: 42

data:
  raw_dir: Data
  processed_dir: artifacts/processed
  manifest_path: artifacts/manifest.csv
  image_extensions: [".jpg", ".jpeg", ".png"]
  min_side: 32
  max_aspect_ratio: 4.0
  min_images_per_class: 10
  max_imbalance_ratio: 5.0
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15

preprocessing:
  image_size: 224
  resize_strategy: letterbox
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  segment_leaf: false
  segment_pad: 8

augmentation:
  enabled: true
  horizontal_flip: 0.5
  vertical_flip: 0.2
  rotation_degrees: 20.0
  random_resized_crop_scale: [0.7, 1.0]
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  color_jitter_saturation: 0.2
  color_jitter_hue: 0.02
  random_erasing: 0.0

model:
  backbone: resnet18
  pretrained: true
  dropout: 0.2
  freeze_backbone: false
  unfreeze_after_epoch: null

training:
  epochs: 5
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  label_smoothing: 0.0
  class_weighting: false
  early_stopping_patience: 3
  early_stopping_metric: val_macro_f1
  # 0 avoids the Windows spawn overhead for small datasets.
  num_workers: 0
  pin_memory: false
  mixed_precision: false
  device: auto
  checkpoint_dir: artifacts/checkpoints
  run_dir: artifacts/runs

serving:
  checkpoint_path: artifacts/checkpoints/best.pt
  host: 127.0.0.1
  port: 8000
  # Below review_threshold a prediction is flagged for a human (FR-12);
  # below unknown_threshold no species is named at all (FR-14).
  review_threshold: 0.70
  unknown_threshold: 0.30
  max_image_bytes: 15728640
  max_archive_bytes: 104857600
  max_zip_entries: 200
  max_zip_uncompressed_bytes: 524288000
  max_compression_ratio: 100.0
  allowed_extensions: [".jpg", ".jpeg", ".png"]
  api_base_url: http://127.0.0.1:8000
  request_timeout_seconds: 120.0
